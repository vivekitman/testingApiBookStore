<div class="container" *ngIf="data as d">
  <header>
    <h1>{{ d.title }}</h1>
    <p>{{ d.vision }}</p>
  </header>

  <section>
    <h2>Chairman Message</h2>
    <p>{{ d.chairmanMessage }}</p>
  </section>

  <section>
    <h2>Latest Announcements</h2>
    <ul>
      <li *ngFor="let notice of d.announcements">
        <a [href]="notice.linkUrl" target="_blank">{{ notice.title }}</a>
        <small>({{ notice.publishDateUtc | date:'mediumDate' }})</small>
      </li>
    </ul>
  </section>

  <section>
    <h2>Quick Links</h2>
    <ul>
      <li *ngFor="let link of d.quickLinks">
        <a [href]="link.url" target="_blank">{{ link.label }}</a>
      </li>
    </ul>
  </section>
</div>
